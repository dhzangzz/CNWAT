    <script>
        function showNow() {
            const d = new Date();
            const pad = n => String(n).padStart(2, '0');
            const days = ['Chủ nhật', 'Thứ hai', 'Thứ ba', 'Thứ tư', 'Thứ năm', 'Thứ sáu', 'Thứ bảy'];
            const str = `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())} — ${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()} (${days[d.getDay()]})`;
            document.getElementById('kq').textContent = str;
        }
    </script>
