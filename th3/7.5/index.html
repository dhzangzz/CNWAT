    <div class="shell">
        <div class="main">
            <aside class="sidebar th-sidebar">
                <div class="profile card">
                    <img class="avatar" src="/dauhuonggiang/img/avatar.jpg" alt="Avatar">
                    <div class="name">Đậu Hương Giang</div>
                    <div class="msv">MSV: AT190216</div>
                    <div class="school">Học viện Kĩ thuật mật mã</div>
                </div>
                <nav class="vnav">
                    <a class="small" href="/dauhuonggiang/th3/7.1/index.html">Ví dụ JS</a>

                </nav>
            </aside>

            <main class="content">
                <div class="card form">
                    <h2>Form đăng ký thành viên</h2>
                    <form id="regForm" novalidate>
                        <div class="row">
                            <label for="fullName">Họ và tên *</label>
                            <div class="ctrl">
                                <input id="fullName" class="required" type="text" placeholder="VD: Đậu Hương Giang"
                                    autocomplete="name">
                                <span class="err" id="eName"></span>
                            </div>
                        </div>

                        <div class="row">
                            <label for="address">Địa chỉ</label>
                            <div class="ctrl">
                                <input id="address" type="text" placeholder="Số nhà, đường, phường...">
                                <span class="err"></span>
                            </div>
                        </div> 
                        
                        <div class="row">
                            <label>Giới tính *</label>
                            <div class="ctrl radio required" role="group" aria-label="Giới tính">
                                <label><input type="radio" name="gender" value="Nữ"> Nữ</label>
                                <label><input type="radio" name="gender" value="Nam"> Nam</label>
                                <span class="err" id="eGender"></span>
                            </div>
                        </div>

                        <div class="row">
                            <label for="email">Email *</label>
                            <div class="ctrl">
                                <input id="email" class="required" type="email" placeholder="ten@domain.com">
                                <span class="err" id="eEmail"></span>
                            </div>
                        </div>

                        <div class="row">
                            <label for="dob">Ngày sinh *</label>
                            <div class="ctrl">
                                <input id="dob" class="required ghost" type="text" maxlength="10" inputmode="numeric"
                                    value="nn/tt/nnnn">
                                <span class="err" id="eDob"></span>
                            </div>
                        </div>

                        <div class="row">
                            <label for="phone">Điện thoại *</label>
                            <div class="ctrl">
                                <input id="phone" class="required" type="text" inputmode="tel" placeholder="09xxxxxxxx">
                                <span class="err" id="ePhone"></span>
                            </div>
                        </div>

                        

                        <div class="row">
                            <label>Khóa đăng ký</label>
                            <div class="ctrl checks" role="group" aria-label="Ngành học">
                                <label><input type="checkbox" name="majors" value="Tiếng Anh"> Tiếng Anh</label>
                                <label><input type="checkbox" name="majors" value="Quản trị"> Quản trị</label>
                                <label><input type="checkbox" name="majors" value="CNTT"> CNTT</label>
                                <span class="err"></span>
                            </div>
                        </div>

                        <div class="row">
                            <label for="pwd">Mật khẩu *</label>
                            <div class="ctrl">
                                <input id="pwd" class="required" type="password" minlength="6" placeholder="≥ 6 ký tự">
                                <span class="err" id="ePwd"></span>
                            </div>
                        </div>

                        <div class="row">
                            <label for="pwd2">Gõ lại mật khẩu *</label>
                            <div class="ctrl">
                                <input id="pwd2" class="required" type="password" minlength="6"
                                    placeholder="Nhập lại giống ô trên">
                                <span class="err" id="ePwd2"></span>
                            </div>
                        </div>

                        <div class="actions">
                            <button type="button" class="btn" id="btn-ok">Chấp nhận</button>
                            <button type="reset" class="btn">Bỏ qua</button>
                        </div>
                    </form>
                </div>
            </main>
        </div>
    </div>
