                    <h1>Máy tính cơ bản</h1>

                    <div class="screen" aria-live="polite">
                        <div class="exp" id="exp"></div><!--dòng trên-->
                        <div class="curr" id="curr">0</div><!--dòng chính, khởi tạo 0-->
                    </div>
                    <div class="keys">
                        <button data-act="clear" class="op">C</button>
                        <button data-act="ce" class="op">CE</button>
                        <button data-act="back" class="op">⌫</button>
                        <button data-op="÷" class="op">÷</button>

                        <button data-num="7">7</button>
                        <button data-num="8">8</button>
                        <button data-num="9">9</button>
                        <button data-op="×" class="op">×</button>

                        <button data-num="4">4</button>
                        <button data-num="5">5</button>
                        <button data-num="6">6</button>
                        <button data-op="−" class="op">−</button>

                        <button data-num="1">1</button>
                        <button data-num="2">2</button>
                        <button data-num="3">3</button>
                        <button data-op="+" class="op">+</button>

                        <button data-num="0" class="span-2">0</button>
                        <button data-dot=".">.</button>
                        <button data-eq="=" class="equal">=</button>
                    </div>
                </div>
